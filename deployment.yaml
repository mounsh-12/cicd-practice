
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-practice-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-practice

  template:
    metadata:
      labels:
        app: cicd-practice

    spec:
      containers:
        - name: cicd-practice-container
          image: mounish10/cicd-practice:day203-secure
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

