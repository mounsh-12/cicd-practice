name: Day 197 Advanced CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Application File
        run: test -f index.html

      - name: Build Success
        run: echo "Application build completed"

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML Content
        run: grep -q "My First CI/CD Project" index.html

      - name: Test Success
        run: echo "Application tests passed"